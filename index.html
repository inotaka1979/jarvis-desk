<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ジャービス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* 図面の一枚。上に銘板とペンの軌跡、中央に作業面、親指の位置に3つの切り替え。本文は左揃え。 */
  --paper:#F2F6F3;   /* 方眼紙の地 */
  --plate:#FFFFFF;   /* 書き込み面 */
  --ink:#13264A;     /* 製図インク */
  --ink-2:#51627F;   /* 補足の文字 */
  --line:#C4D5D0;    /* 罫線 */
  --pen:#1747C9;     /* ペン青：操作できるもの */
  --mark:#C8382C;    /* 赤ペン：所見と注意 */
  --grid:rgba(19,38,74,.055);
  --key-bg:#13264A; --key-fg:#FFFFFF;
  --lamp-build:#1F9D55; --lamp-wait:#D99400; --lamp-run:#13264A; --lamp-spec:#1747C9; --lamp-hold:#93A1B5;
  --wait-wash:#F9EED6;
  --shade:rgba(10,20,40,.45);
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F2B57; --plate:#173A70; --ink:#EEF4FF; --ink-2:#A8C0E6; --line:#2D5290; --pen:#FFD45C; --mark:#FF8F80;
    --grid:rgba(238,244,255,.055); --key-bg:#FFD45C; --key-fg:#0F2B57;
    --lamp-build:#5BE08F; --lamp-wait:#FFC043; --lamp-run:#EEF4FF; --lamp-spec:#8FB8FF; --lamp-hold:#6E88B5;
    --wait-wash:#3C4F69; --shade:rgba(3,10,26,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F2B57; --plate:#173A70; --ink:#EEF4FF; --ink-2:#A8C0E6; --line:#2D5290; --pen:#FFD45C; --mark:#FF8F80;
  --grid:rgba(238,244,255,.055); --key-bg:#FFD45C; --key-fg:#0F2B57;
  --lamp-build:#5BE08F; --lamp-wait:#FFC043; --lamp-run:#EEF4FF; --lamp-spec:#8FB8FF; --lamp-hold:#6E88B5;
  --wait-wash:#3C4F69; --shade:rgba(3,10,26,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{
  background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;overflow:hidden;line-break:strict;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.grow{flex:1}

.app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto}

/* 銘板 */
.head{padding:10px 16px 0;border-bottom:1.5px solid var(--ink);background:var(--paper)}
.name-row{display:flex;align-items:center;gap:10px;min-height:44px}
.nameplate{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.1em;line-height:1.2;overflow-wrap:anywhere;min-width:0}
.presence{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.presence .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-2)}
.presence:not([data-state="idle"]) .dot{background:var(--pen);border-color:var(--pen)}
.presence:not([data-state="idle"]){color:var(--ink)}
.presence[data-state="speaking"]{display:none}
.icon-btn{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:10px;color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--pen)}
.icon-btn[aria-pressed="false"] .wave{display:none}
.trace{display:block;width:100%;height:28px}

.banner{margin:10px 16px 0;padding:8px 12px;border:1px solid var(--mark);border-left-width:4px;border-radius:4px;background:var(--plate);font-size:13.5px}

.views{flex:1;min-height:0}
.view{height:100%;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}

/* 相談 */
.log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 10px;display:flex;flex-direction:column;gap:18px}
.turn{overflow-wrap:anywhere}
.turn.me{align-self:flex-end;max-width:86%;background:var(--plate);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:8px 13px;white-space:pre-wrap}
.turn.jv{padding-left:12px;border-left:2px solid var(--pen);max-width:68ch}
.turn.hello p{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.65;text-wrap:pretty}
.wait{color:var(--ink-2)}
.fine{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.applied{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.applied p{font-size:12.5px;color:var(--ink-2);padding-left:14px;position:relative}
.applied p::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--lamp-build)}
.errline{border:1px solid var(--mark);border-left-width:4px;border-radius:4px;background:var(--plate);padding:8px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ink);background:var(--plate);border-radius:999px;padding:7px 14px;min-height:40px;font-size:13.5px;line-height:1.4;text-align:left}
.chip[aria-pressed="true"]{background:var(--key-bg);color:var(--key-fg);border-color:var(--key-bg)}
.link{border:0;background:none;padding:6px 2px;color:var(--pen);text-decoration:underline;text-underline-offset:3px;font-size:13px;min-height:32px}

.composer{padding:6px 12px 10px;border-top:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:4px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:0 4px}
.focus{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border:1px solid var(--pen);border-radius:999px;padding:1px 4px 1px 10px;background:var(--plate)}
.focus button{border:0;background:none;width:28px;height:28px;border-radius:50%;line-height:1;font-size:16px}
.partial{font-size:13px;color:var(--ink-2);padding:0 4px;min-height:0}
.partial:empty{display:none}
.input-row{display:flex;align-items:flex-end;gap:8px}
.input-row textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--ink);border-radius:14px;background:var(--plate);padding:9px 13px;font-size:16px;line-height:1.5;max-height:150px}
.key{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--key-bg);background:var(--key-bg);color:var(--key-fg);display:inline-flex;align-items:center;justify-content:center}
.key:disabled{opacity:.4;cursor:default}
.key.ghost{background:var(--plate);color:var(--ink);border-color:var(--ink)}
.key.ghost.on{background:var(--mark);border-color:var(--mark);color:var(--plate)}

/* 切り替え */
.tabs{display:flex;border-top:1.5px solid var(--ink);background:var(--paper)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;min-height:52px;text-decoration:none;color:var(--ink-2);font-family:var(--display);font-weight:500;font-size:14.5px;letter-spacing:.14em;border-top:3px solid transparent;margin-top:-1.5px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--pen)}

/* 見出しとボタン */
.view-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.view-head h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;line-height:1.3}
.sec-title{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--plate);font-family:var(--display);font-weight:700;font-size:14px;line-height:1.3;text-align:center}
.btn.primary{background:var(--key-bg);color:var(--key-fg);border-color:var(--key-bg)}
.btn.danger{border-color:var(--mark);color:var(--mark)}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* 台帳 */
.note{border:1px solid var(--mark);border-left-width:4px;border-radius:4px;background:var(--plate);padding:10px 14px}
.note .sec-title{color:var(--mark);margin-bottom:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.filters .chip{min-height:36px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.ann{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:10px;min-height:82px;border:1px solid var(--line);border-radius:6px;background:var(--plate)}
.tile .nm{font-family:var(--display);font-weight:700;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere;text-wrap:balance}
.tile .st{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);line-height:1.3}
.tile[data-status="wait"]{background:var(--wait-wash);border-color:var(--lamp-wait)}
.tile[data-status="wait"] .st{color:var(--ink)}
.tile[data-status="hold"] .nm{color:var(--ink-2)}
.lamp{--c:var(--lamp-hold);flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--c);background:transparent}
.lamp[data-s="build"]{--c:var(--lamp-build);background:var(--c)}
.lamp[data-s="run"]{--c:var(--lamp-run);background:var(--c)}
.lamp[data-s="spec"]{--c:var(--lamp-spec)}
.lamp[data-s="wait"]{--c:var(--lamp-wait);background:var(--c);border-radius:1.5px;transform:rotate(45deg)}
.sheet{background:var(--plate);border:1.5px solid var(--ink);border-radius:4px}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none}
.row:first-child{border-top:0}
.row .hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.row .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.4}
.row .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.row .kv{font-size:13.5px;line-height:1.6}
.row .k{display:inline-block;min-width:4.6em;color:var(--ink-2);font-size:12px}
.row .asof{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.empty{padding:18px 14px;color:var(--ink-2);font-size:14px}

/* 発注 */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lab{font-family:var(--display);font-weight:500;font-size:12.5px;color:var(--ink-2)}
.f input[type="text"],.f select,.f textarea{width:100%;border:1px solid var(--ink-2);border-radius:8px;background:var(--plate);padding:9px 11px;font-size:16px;line-height:1.5}
.f textarea{resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.5}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--pen)}
.form{display:flex;flex-direction:column;gap:12px}
.tb{display:grid;grid-template-columns:auto 1fr;border-bottom:1.5px solid var(--ink)}
.tb dt,.tb dd{margin:0;padding:6px 12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.tb dt:first-of-type,.tb dd:first-of-type{border-top:0}
.tb dt{font-family:var(--display);font-weight:500;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line);white-space:nowrap;display:flex;align-items:center}
.tb dd{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tb dd.ttl{font-family:var(--display);font-weight:700;font-size:16px}
.doc{padding:14px 14px 18px}
.src{width:100%;min-height:160px;border:1px solid var(--ink-2);border-radius:8px;background:var(--plate);padding:9px 11px;font-size:13px;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* 返答の本文 */
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.5em 0;padding-left:1.45em}
.md li{margin:.2em 0}
.md li>ul,.md li>ol{margin:.2em 0}
.md h2,.md h3,.md h4,.md h5,.md h6{font-family:var(--display);font-weight:700;line-height:1.4;margin:1.1em 0 .35em;text-wrap:balance}
.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:15px}.md h5,.md h6{font-size:14px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:.05em .35em}
.md pre{margin:.6em 0;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow-x:auto;line-height:1.55}
.md pre code{border:0;background:none;padding:0;font-size:12.5px;white-space:pre}
.md blockquote{margin:.6em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md .tbl{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.md th{font-family:var(--display);font-weight:700}
.md a{color:var(--pen)}
.turn.jv .md code,.turn.jv .md pre{background:var(--plate)}

/* 重ねて開く面 */
dialog{border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:var(--shade)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;flex:1}
.dlg-body{padding:14px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.group{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.mem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mem li{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.55}
.mem li:first-child{border-top:0}
.mem li span{flex:1;padding-top:8px;overflow-wrap:anywhere}
.add-row{display:flex;gap:8px;align-items:flex-end}
.toast{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--key-bg);color:var(--key-fg);border-radius:10px;padding:8px 14px;font-size:13.5px;line-height:1.5;z-index:5}

@media (min-width:700px){
  body{font-size:15.5px}
  .head{padding:14px 24px 0}
  .log{padding:22px 24px 12px}
  .scroll{padding:22px 24px 32px}
  .composer{padding:8px 20px 14px}
  .ann{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
@media (prefers-reduced-motion:no-preference){
  .wait::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="name-row">
      <h1 class="nameplate" id="nameplate">ジャービス</h1>
      <p class="presence" id="presence" data-state="idle" role="status"><span class="dot" aria-hidden="true"></span><span id="presence-text">待機中</span></p>
      <button type="button" class="link" id="stop-voice" hidden>読み上げを止める</button>
      <button type="button" class="icon-btn" id="voice-toggle" hidden aria-pressed="false" aria-label="返答の読み上げ">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path class="wave" d="M16 9a4.2 4.2 0 0 1 0 6"/><path class="wave" d="M18.6 6.4a8 8 0 0 1 0 11.2"/></svg>
      </button>
      <button type="button" class="icon-btn" id="open-settings" aria-label="設定を開く">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg>
      </button>
    </div>
    <canvas class="trace" id="trace" aria-hidden="true"></canvas>
  </header>

  <p class="banner" id="banner" hidden></p>

  <main class="views">
    <section class="view" id="view-talk" aria-label="相談">
      <div class="log" id="log"></div>
      <div class="composer">
        <div class="tools" id="tools" hidden>
          <span class="focus" id="focus-chip" hidden><span id="focus-name"></span><button type="button" id="focus-clear" aria-label="話題の指定を外す">×</button></span>
          <span class="grow"></span>
          <button type="button" class="link" id="to-order">この相談を発注書にする</button>
          <button type="button" class="link" id="new-talk">新しい相談</button>
        </div>
        <p class="partial" id="partial"></p>
        <div class="input-row">
          <button type="button" class="key ghost" id="mic" hidden aria-pressed="false" aria-label="音声で入力する">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <label class="sr" for="msg">メッセージ</label>
          <textarea id="msg" rows="1" placeholder="話しかける" autocomplete="off"></textarea>
          <button type="button" class="key" id="send" aria-label="送る">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
          <button type="button" class="key" id="stop" hidden aria-label="返答を止める">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
        <p class="fine" id="talk-note" hidden></p>
      </div>
    </section>

    <section class="view" id="view-ledger" aria-label="台帳" hidden>
      <div class="scroll" id="ledger-body"></div>
    </section>

    <section class="view" id="view-orders" aria-label="発注" hidden>
      <div class="scroll" id="orders-body"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="画面の切り替え">
    <a class="tab" href="#talk" data-tab="talk">相談</a>
    <a class="tab" href="#ledger" data-tab="ledger">台帳</a>
    <a class="tab" href="#orders" data-tab="orders">発注</a>
  </nav>
</div>

<p class="toast" id="toast" role="status" hidden></p>

<dialog id="dlg-project" aria-labelledby="pj-title">
  <div class="dlg-head">
    <h2 id="pj-title">案件</h2>
    <button type="button" class="icon-btn" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dlg-body">

<script>
(() => {

const STATUS = {

const STATUS_ORDER = ['wait', 'build', 'spec', 'run', 'hold'];
const KIND = { work: '会社', personal: '個人' };
const TARGETS = ['Claude Code', 'Microsoft 365 Copilot', '社内ローカルAI'];
const PRESENCE = { idle: '待機中', listening: '聞いています', thinking: '考えています', writing: '書いています', speaking: '話しています' };
const DEFAULT_PREFS = { assistantName: 'ジャービス', userName: '井上さん', length: 'short', tier: 'auto', voiceOn: false, voice: 'buttery', deviceVoice: false, review: null };

const S = {
  prefs: { ...DEFAULT_PREFS }, memory: [], projects: [], orders: [], turns: [],
  tab: 'talk', focus: null, filterKind: 'all', filterStatus: null,
  caps: { sample: undefined, dictation: undefined, tts: undefined, downloads: undefined },

/* ---------- 返答の本文を組む（Markdownの一部） ---------- */
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);

const mend = (t) => { t = String(t || '').replace(/(^|[^*])\*$/, '$1'); return ((t.match(/\*\*/g) || []).length % 2) ? t + '**' : t; };

/* ---------- 台帳への書き込み指示を本文から分ける ---------- */
const LEDGER_OPEN = '<<<LEDGER';
function splitLedger(text, streaming) {
  text = String(text || '');
  const i = text.indexOf(LEDGER_OPEN);
  if (i < 0) {
    if (streaming) {
      for (let k = Math.min(LEDGER_OPEN.length - 1, text.length); k > 0; k--) {
        if (text.endsWith(LEDGER_OPEN.slice(0, k))) return { body: text.slice(0, -k).trimEnd(), raw: null };

  if (j >= 0) raw = raw.slice(0, j);

}
function parseActions(raw) {

/* ---------- 保存 ---------- */
const LS_KEY = 'jarvis-desk-v1';

}

}
function fitTurns(turns, maxBytes = 120000) {
  let list = turns.slice(-60).map((t) => {
    const o = { role: t.role, content: String(t.content || '').slice(0, 12000), at: t.at };
    if (t.acts && t.acts.length) o.acts = t.acts.map((a) => ({ label: a.label }));
    if (t.cut) o.cut = true; if (t.stopped) o.stopped = true; if (t.tier) o.tier = t.tier;

  });

}

}

    S.memory = Array.isArray(v.memory) ? v.memory : [];

    S.orders = Array.isArray(v.orders) ? v.orders : [];

}
const Store = {
  saveDesk() {
    if (S.store === 'db') { const data = { v: 1, prefs: { ...S.prefs }, memory: S.memory.map((m) => ({ ...m })) }; enqueue('desk', () => db.doc(base + '/desk').set(data)); }
    else persistLocal();
  },
  saveTalk() {
    if (S.store === 'db') { const data = { turns: fitTurns(S.turns), updatedAt: Date.now() }; enqueue('talk', () => db.doc(base + '/talk').set(data)); }
    else persistLocal();
  },
  saveProject(p) {
    if (S.store === 'db') { const data = { ...p }; delete data.id; enqueue('p:' + p.id, () => db.doc(base + '/desk/projects/' + p.id).set(data)); }
    else persistLocal();
  },
  deleteProject(id) {
    if (S.store === 'db') enqueue('p:' + id, () => db.doc(base + '/desk/projects/' + id).delete());
    else persistLocal();
  },
  saveOrder(o) {
    if (S.store === 'db') { const data = { ...o }; delete data.id; enqueue('o:' + o.id, () => db.doc(base + '/desk/orders/' + o.id).set(data)); }
    else persistLocal();

const byOrder = (a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), 'ja');
const byNewest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);

function startDb() {
  let pending = 4;
  /* 保存先が10秒答えなければ、その旨を出して空の状態で使えるようにする。届いた分はあとから反映される。 */
  const staleTimer = setTimeout(() => { if (!S.dbError) { S.stale = true; renderBanner(); } if (!S.loaded) finishLoad(); }, 10000);
  const settle = () => { if (--pending === 0 && !S.loaded) finishLoad(); };
  const live = (snap) => { if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(staleTimer); if (S.stale) { S.stale = false; renderBanner(); } } };
  const first = { desk: true, projects: true, orders: true };
  const once = (k) => { if (first[k]) { first[k] = false; settle(); } };
  const fail = (k) => () => { clearTimeout(staleTimer); S.stale = false; S.dbError = true; once(k); renderBanner(); };

  db.doc(base + '/desk').onSnapshot((snap) => {
    live(snap);
    if (snap.exists) {
      const d = snap.data() || {};
      S.prefs = { ...DEFAULT_PREFS, ...(d.prefs || {}) };
      S.memory = Array.isArray(d.memory) ? d.memory.map((m) => ({ ...m })) : [];
    }
    const loaded = S.loaded; once('desk');
    if (loaded) { renderHeader(); refreshGreeting(); updateVoiceUI(); if (S.tab === 'ledger') renderLedger(); if ($('#dlg-settings').open) renderMemory(); }
  }, fail('desk'));

  db.collection(base + '/desk/projects').onSnapshot((snap) => {
    live(snap);
    S.projects = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(byOrder);
    const loaded = S.loaded; once('projects');
    if (loaded) { refreshGreeting(); if (S.tab === 'ledger') renderLedger(); if (S.tab === 'orders' && !S.openOrder) renderOrders(); updateTools(); }
  }, fail('projects'));

  db.collection(base + '/desk/orders').onSnapshot((snap) => {
    live(snap);
    S.orders = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(byNewest);
    const loaded = S.loaded; once('orders');
    if (loaded && S.tab === 'orders' && !S.drafting && !S.openOrder) renderOrders();
  }, fail('orders'));

  db.doc(base + '/talk').get().then((snap) => {
    if (!snap.exists || S.turns.length || S.busy) return;
    const d = snap.data() || {};
    S.turns = Array.isArray(d.turns) ? d.turns.map((t) => ({ ...t, acts: Array.isArray(t.acts) ? t.acts.map((a) => ({ ...a })) : undefined })) : [];
    if (S.loaded) renderLog();
  }, () => {}).then(settle);
}
function finishLoad() {
  S.loaded = true;
  renderHeader(); renderLog(); renderLedger(); renderOrders(); updateComposer(); updateTools(); updateVoiceUI(); renderBanner();
}

/* ---------- 状態表示とペンの軌跡 ---------- */
const Trace = (() => {

  root.append(h('div', { class: 'view-head' }, h('h2', { text: '発注書を作る' })));
  if (S.orderError) root.append(h('div', { class: 'errline' }, h('span', { text: errText(S.orderError) })));
  const sel = h('select', { id: 'od-project', onchange: (e) => { S.form.projectId = e.target.value; } },
    h('option', { value: '', text: '指定しない' }), S.projects.map((p) => h('option', { value: p.id, text: p.name })));
  sel.value = S.projects.some((p) => p.id === S.form.projectId) ? S.form.projectId : '';
  const tgt = h('select', { id: 'od-target', onchange: (e) => { S.form.target = e.target.value; renderOrders(); } }, TARGETS.map((t) => h('option', { value: t, text: t })));
  tgt.value = S.form.target;
  const brief = h('textarea', { id: 'od-brief', rows: 5, placeholder: '作らせたいこと、直させたいことを書く。箇条書きでも、話し言葉でも構いません。', oninput: (e) => { S.form.brief = e.target.value; } });
  brief.value = S.form.brief;
  const staged = h('input', { type: 'checkbox', id: 'od-staged', onchange: (e) => { S.form.staged = e.target.checked; } });
  staged.checked = !!S.form.staged;
  root.append(h('div', { class: 'form' },
    h('div', { class: 'f2' },
      h('div', { class: 'f' }, h('label', { for: 'od-project', text: '対象の案件' }), sel),
      h('div', { class: 'f' }, h('label', { for: 'od-target', text: '発注先' }), tgt),
    ),
    h('div', { class: 'f' }, h('label', { for: 'od-brief', text: '依頼の内容' }), brief),
    S.form.target === 'Microsoft 365 Copilot' ? null : h('label', { class: 'check' }, staged, h('span', { text: '段階ごとに止めて報告させる' })),
    h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn primary', text: '発注書を作る', disabled: off, onclick: () => {
      const v = brief.value.trim(); if (!v) { brief.focus(); toast('依頼の内容を書いてください。'); return; }
      S.form.brief = v; makeOrder(v, sel.value);
    } })),
    off ? h('p', { class: 'fine', text: 'Claudeにつながっていないため、いまは作成できません。' }) : null,
  ));

  root.append(h('h3', { class: 'sec-title', text: 'これまでの発注書' }));
  if (!S.orders.length) root.append(h('p', { class: 'empty', text: 'まだありません。作った発注書はここに残ります。' }));
  else root.append(h('div', { class: 'sheet rows' }, S.orders.map((o) => h('button', { type: 'button', class: 'row', onclick: () => { S.openOrder = o; S.orderError = null; renderOrders(); $('#orders-body').scrollTop = 0; } },
    h('span', { class: 'hd' }, h('span', { class: 'nm', text: o.title || '発注書' })),
    h('span', { class: 'asof', text: [o.no, o.projectName || '指定なし', o.target].join('　') }),
  ))));
  root.scrollTop = keep;
}

/* ---------- 設定 ---------- */
function renderMemory() {
  const ul = $('#mem-list'); ul.textContent = '';
  if (!S.memory.length) { ul.append(h('li', null, h('span', { class: 'fine', text: 'まだありません。' }))); return; }
  for (const m of S.memory) ul.append(h('li', null, h('span', { text: m.text }),
    h('button', { type: 'button', class: 'link', text: '消す', 'aria-label': '「' + clip(m.text, 20) + '」を消す', onclick: () => { S.memory = S.memory.filter((x) => x.id !== m.id); Store.saveDesk(); renderMemory(); } })));
}
function openSettings() {
  $('#set-user').value = S.prefs.userName || ''; $('#set-name').value = S.prefs.assistantName || '';
  $('#set-length').value = S.prefs.length || 'short'; $('#set-tier').value = S.prefs.tier || 'auto';
  $('#set-voice').checked = !!S.prefs.voiceOn; $('#set-voicekind').value = S.prefs.voice || 'buttery'; $('#set-device').checked = !!S.prefs.deviceVoice;
  $('#export').hidden = !S.caps.downloads;
  $('#store-note').textContent = S.store === 'db' ? '台帳・会話・発注書は、このページ専用の保存先にあなた用として保存されます。ページを共有しても、ほかの人には見えません。'
    : 'この表示では、台帳と会話はこの端末のブラウザにだけ保存されます。';
  renderMemory(); updateVoiceUI();
  openDialog($('#dlg-settings'));
}
function setPref(k, v) { if (S.prefs[k] === v) return; S.prefs[k] = v; Store.saveDesk(); renderHeader(); refreshGreeting(); updateVoiceUI(); }

/* ---------- 重ねて開く面 ---------- */
function openDialog(d) { if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', ''); }
function closeDialog(d) { if (typeof d.close === 'function') { if (d.open) d.close(); } else d.removeAttribute('open'); }
let confirmDone = null;
function confirmBox(text, yes) {
  $('#cf-text').textContent = text; $('#cf-yes').textContent = yes || '削除する';
  openDialog($('#dlg-confirm'));
  return new Promise((resolve) => { confirmDone = (v) => { confirmDone = null; closeDialog($('#dlg-confirm')); resolve(v); }; });
}

/* ---------- 画面の切り替え ---------- */
const TABS = ['talk', 'ledger', 'orders'];
function showTab(t) {
  if (!TABS.includes(t)) t = 'talk';
  S.tab = t;
  for (const k of TABS) $('#view-' + k).hidden = k !== t;
  document.querySelectorAll('.tab').forEach((a) => { if (a.dataset.tab === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (t === 'ledger') renderLedger();
  if (t === 'orders') renderOrders();
  if (t === 'talk') requestAnimationFrame(toEnd);
}
function go(t) { try { if (location.hash !== '#' + t) location.hash = t; } catch (e) { /* 番地を変えられない表示 */ } showTab(t); }
function route() { showTab((location.hash || '').replace('#', '')); }

/* ---------- 操作のつなぎ込み ---------- */
function wire() {
  document.querySelectorAll('.tab').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.tab); }));
  window.addEventListener('hashchange', route);

  const ta = $('#msg');
  ta.addEventListener('input', () => autosize(ta));
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); $('#send').click(); } });
  $('#send').addEventListener('click', () => { const v = ta.value; if (!v.trim() || S.busy) return; ta.value = ''; autosize(ta); send(v); });
  $('#stop').addEventListener('click', () => { if (S.ctl) S.ctl.abort(); });
  $('#stop-voice').addEventListener('click', stopSpeaking);
  $('#focus-clear').addEventListener('click', () => { S.focus = null; updateTools(); });
  $('#to-order').addEventListener('click', orderFromTalk);
  $('#new-talk').addEventListener('click', async () => {
    if (S.busy) return;
    if (!(await confirmBox('いまの会話を消して、新しい相談を始めます。台帳と発注書は残ります。', '消して始める'))) return;
    S.turns = []; S.focus = null; Store.saveTalk(); renderLog();
  });

  $('#open-settings').addEventListener('click', openSettings);
  $('#voice-toggle').addEventListener('click', () => {
    const on = !S.prefs.voiceOn; setPref('voiceOn', on);
    if (on) { unlockDeviceVoice(); toast('返答を読み上げます。'); } else { stopSpeaking(); toast('読み上げを止めました。'); }
  });
  $('#set-user').addEventListener('change', (e) => setPref('userName', e.target.value.trim() || DEFAULT_PREFS.userName));
  $('#set-name').addEventListener('change', (e) => setPref('assistantName', e.target.value.trim() || DEFAULT_PREFS.assistantName));
  $('#set-length').addEventListener('change', (e) => setPref('length', e.target.value));
  $('#set-tier').addEventListener('change', (e) => setPref('tier', e.target.value));
  $('#set-voice').addEventListener('change', (e) => { setPref('voiceOn', e.target.checked); if (!e.target.checked) stopSpeaking(); });
  $('#set-voicekind').addEventListener('change', (e) => setPref('voice', e.target.value));
  $('#set-device').addEventListener('change', (e) => { S.prefs.deviceVoice = e.target.checked; S.prefs.voiceOn = e.target.checked; Store.saveDesk(); if (e.target.checked) unlockDeviceVoice(); else stopSpeaking(); updateVoiceUI(); });
  $('#voice-test').addEventListener('click', () => speak((S.prefs.assistantName || 'ジャービス') + 'です。読み上げの確認です。', true));
  const addMem = () => { const i = $('#mem-new'); const v = i.value.trim(); if (!v) { i.focus(); return; } S.memory.push({ id: uid('m'), text: clip(v, 300), at: Date.now() }); i.value = ''; Store.saveDesk(); renderMemory(); };
  $('#mem-add').addEventListener('click', addMem);
  $('#mem-new').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addMem(); } });
  $('#export').addEventListener('click', async () => {
    const dl = S.caps.downloads; if (!dl) return;
    const data = JSON.stringify({ exportedAt: new Date().toISOString(), prefs: S.prefs, memory: S.memory, projects: S.projects, orders: S.orders, turns: S.turns }, null, 2);
    try { await dl.save({ filename: 'jarvis-desk-' + ymd() + '.json', data }); toast('書き出しました。'); }
    catch (e) { if (!e || e.code !== 'declined') toast('書き出せませんでした。'); }
  });
  $('#clear-talk').addEventListener('click', async () => {
    if (S.busy) return;
    if (!(await confirmBox('会話をすべて消します。台帳と発注書は残ります。', '会話を消す'))) return;
    S.turns = []; Store.saveTalk(); renderLog(); toast('会話を消しました。');
  });

  document.querySelectorAll('#dlg-project textarea').forEach((t) => t.addEventListener('input', () => fitField(t)));
  const st = $('#pj-status');
  STATUS_ORDER.forEach((s) => st.append(h('option', { value: s, text: STATUS[s].label })));
  $('#pj-save').addEventListener('click', () => { if (saveProjectForm()) closeDialog($('#dlg-project')); });
  $('#pj-talk').addEventListener('click', () => { const p = saveProjectForm(); if (!p) return; closeDialog($('#dlg-project')); S.focus = p.id; updateTools(); go('talk'); $('#msg').focus(); });
  $('#pj-order').addEventListener('click', () => { const p = saveProjectForm(); if (!p) return; closeDialog($('#dlg-project')); S.form.projectId = p.id; S.openOrder = null; go('orders'); });
  $('#pj-delete').addEventListener('click', async () => {
    const p = S.projects.find((x) => x.id === editing); if (!p) return;
    if (!(await confirmBox('「' + p.name + '」を台帳から削除します。元に戻せません。'))) return;
    S.projects = S.projects.filter((x) => x.id !== p.id); Store.deleteProject(p.id);
    closeDialog($('#dlg-project')); refreshGreeting(); renderLedger(); updateTools();
  });

  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('click', (e) => { if (e.target === d) closeDialog(d); });
    d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeDialog(d)));
  });
  $('#cf-yes').addEventListener('click', () => { if (confirmDone) confirmDone(true); });
  $('#cf-no').addEventListener('click', () => { if (confirmDone) confirmDone(false); });
  $('#dlg-confirm').addEventListener('close', () => { if (confirmDone) confirmDone(false); });
}

/* ---------- 起動 ---------- */
async function start(saved) {
  wire(); route(); renderHeader(); renderLog(); updateComposer(); updateVoiceUI();
  if (saved && typeof saved.draft === 'string') { $('#msg').value = saved.draft; autosize($('#msg')); }
  const c = window.claude;
  if (!c || typeof c.use !== 'function') {
    S.caps = { sample: null, dictation: null, tts: null, downloads: null };
    S.store = 'local'; loadLocal(); finishLoad(); return;
  }
  const cap = (name, then) => c.use(name).then((v) => { S.caps[name] = v || null; if (v && then) then(v); }, () => { S.caps[name] = null; });
  cap('sample').then(() => { updateComposer(); renderBanner(); if (S.tab !== 'talk') showTab(S.tab); });
  cap('dictation', wireDictation).then(updateVoiceUI);
  cap('tts', wireTts).then(updateVoiceUI);
  cap('downloads').then(() => { if (S.tab === 'orders') renderOrders(); });
  let id = null; let store = null;
  try {
    const got = await Promise.all([c.use('db'), c.use('user')]);
    store = got[0]; id = got[1] ? await got[1].id() : null;
  } catch (e) { store = null; }
  if (store && id) { db = store; base = 'data/users/' + id; S.store = 'db'; startDb(); }
  else { S.store = 'local'; loadLocal(); finishLoad(); }
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ draft: $('#msg').value })); } catch (e) { /* 引き継ぎなしで続ける */ } }
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
